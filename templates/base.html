{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VernacularAI Tutor</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #4f46e5;
            text-decoration: none;
        }

        .logo span {
            color: #111827;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #4f46e5;
        }

        /* MAIN */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: auto;
            padding: 45px 0;
        }

        /* HERO */

        .hero {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 25px;
            padding: 55px;
            color: white;
            margin-bottom: 35px;
            box-shadow: 0 15px 40px rgba(79, 70, 229, 0.20);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
            max-width: 650px;
            line-height: 1.6;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #e5e7eb;
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        .card-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background: #eef2ff;
            font-size: 27px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 10px;
            font-size: 22px;
        }

        .card p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* BUTTON */

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 10px;
            background: #4f46e5;
            color: white !important;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .button.secondary {
            background: #eef2ff;
            color: #4f46e5 !important;
        }

        /* FORMS */

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            margin-top: 7px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #eef2ff;
        }

        /* RESULT */

        .result {
            background: white;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .result h1 {
            margin-bottom: 15px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
            margin-top: 30px;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .navbar {
                padding: 0 5%;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 14px;
            }

            .container {
                width: 92%;
            }

            .hero {
                padding: 35px 25px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            Vernacular<span>AI</span>
        </a>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'tutor' %}">
                AI Tutor
            </a>

            <a href="{% url 'quiz' %}">
                Quiz
            </a>

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

        </div>

    </nav>


    <main class="container">

        {% block content %}

        {% endblock %}

    </main>


    <footer>

        <p>
            © 2026 VernacularAI Tutor
        </p>

        <p>
            Learn English • Practice • Improve 🚀
        </p>

    </footer>

</body>
</html>
